<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cookie Jar</title>
<meta name="description" content="A one-minute weekly money check-in. See if you're moving ahead or falling behind. Private: saved only on your phone.">
<meta name="theme-color" content="#5A3825">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cookie Jar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* VOICE  everyday money tool, calm and plain, sister app to Daily Bread
   IDEA   a cash box: green band on top holds the one number that matters on each tab
   PICTURE the big figure in the band, then a net-worth line and profit bars
   COLOUR warm cocoa band, white cards, cookie gold for highlights, green up / red down
   TYPE   system fonts only (works offline, nothing loads from other sites); tabular numbers
   LAYOUT phone first: band, scrolling cards, two tabs in thumb reach; centred 640px column on a computer */
:root{
  --band:#5A3825; --accent:#8A4F25; --gold:#E2A52E; --gold-ink:#7A5200; --btn-dark:#8A5A36;
  --ink:#221A15; --muted:#66584E; --paper:#F7F4F1; --card:#FFFFFF; --line:#E8E0D8; --soft:#F3EAE2;
  --pos:#157347; --neg:#B42318; --neg-soft:#FCE9E7; --warn:#8A4B00; --warn-soft:#FDF1DC;
  --display:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --band:#3B2619; --accent:#E9B98A; --gold:#F0BE5A; --gold-ink:#F0BE5A; --btn-dark:#8A5A36;
    --ink:#F3ECE6; --muted:#BCAEA3; --paper:#120E0B; --card:#1E1814; --line:#352A21; --soft:#2A2019;
    --pos:#72D3A6; --neg:#FF8C7C; --neg-soft:#3A1D1A; --warn:#F3B661; --warn-soft:#3A2A12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --band:#3B2619; --accent:#E9B98A; --gold:#F0BE5A; --gold-ink:#F0BE5A; --btn-dark:#8A5A36;
    --ink:#F3ECE6; --muted:#BCAEA3; --paper:#120E0B; --card:#1E1814; --line:#352A21; --soft:#2A2019;
  --pos:#72D3A6; --neg:#FF8C7C; --neg-soft:#3A1D1A; --warn:#F3B661; --warn-soft:#3A2A12; color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* band */
.top{flex:none;background:var(--band);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.wrap{max-width:640px;margin:0 auto}
.row1{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.brand{display:inline-flex;align-items:center;gap:8px;font:700 15px/1 var(--display);letter-spacing:.2px}
.brand i{width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.status{display:inline-flex;align-items:center;gap:6px;opacity:.92}
.status i{width:8px;height:8px;border-radius:50%;background:#9FE3BF}
.hero-l{margin:14px 0 0;font-size:15px;opacity:.9}
.hero-n{margin:2px 0 10px;font:700 clamp(36px,11vw,52px)/1.05 var(--display);letter-spacing:-.02em}
.hero-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.pill.gold{background:var(--gold);color:#2A1C00}

/* notices */
#notice:empty{display:none}
.note{margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:12px;padding:10px 12px 10px 14px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.note p{margin:0;flex:1 1 200px;font-weight:600}
.note.info{background:var(--soft);color:var(--ink)}
.note .x{border:0;background:none;color:inherit;font-size:22px;line-height:1;min-width:44px;min-height:40px}

/* content */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h2{font:700 19px/1.25 var(--display);margin:0 0 4px;text-wrap:balance}
.card h3{font:700 15px/1.3 var(--body);margin:12px 0 4px;color:var(--muted)}
.card p{margin:0 0 8px}
.hint{color:var(--muted);font-size:14px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.head h2{margin:0}
.due{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.due p{font-weight:600}
.empty{text-align:left}
.empty h2{font-size:22px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:700;border:1.5px solid var(--band);background:var(--band);color:#fff;text-decoration:none;min-height:46px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.big{min-height:54px;font-size:17px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btns .btn{flex:1 1 150px}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:10px 0;min-height:44px}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){background:var(--btn-dark);border-color:var(--btn-dark)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){background:var(--btn-dark);border-color:var(--btn-dark)}}

/* rows */
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:11px 0;min-height:52px}
.rowbtn .grow{flex:1}
.rowbtn .sub{display:block;color:var(--muted);font-size:13px}
.rowbtn .amt{text-align:right;font-weight:700}
.rowbtn .amt small{display:block;font-weight:600;font-size:13px}
.chev{color:var(--muted);flex:none}
.group{display:flex;justify-content:space-between;margin:12px 0 0;font-weight:700;font-size:14px;color:var(--muted)}

/* figures */
.fig{position:relative;height:190px;margin:6px 0 2px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig text{font:600 12px var(--body);fill:var(--muted)}
.fig .lab{font:700 14px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px}
.bars{display:grid;grid-template-columns:fit-content(40%) minmax(0,1fr) auto;gap:8px 10px;align-items:center;margin-top:8px}
.bars .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bars .track{display:block}
.bars .bar{display:block;height:100%;border-radius:7px;background:var(--pos)}
.bars .bar.neg{background:var(--neg)}
.bars .v{font-weight:700;text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:10px;margin-top:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 21px/1.2 var(--display)}
.stat span{font-size:13px;color:var(--muted)}

/* tick */
.tick{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--accent);background:transparent;display:inline-grid;place-items:center;color:transparent}
.tick svg{width:22px;height:22px}
.tick[aria-pressed="true"]{background:var(--pos);border-color:var(--pos);color:#fff}
:root[data-theme="dark"] .tick[aria-pressed="true"]{color:#08110C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tick[aria-pressed="true"]{color:#08110C}}
.tick:disabled{opacity:.35;cursor:default}
.rentrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.rentrow:first-of-type{border-top:0}
.rentrow .grow{flex:1}
.rentrow .sub{display:block;color:var(--muted);font-size:13px}

/* month grid */
.months{display:grid;grid-template-columns:3em auto minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:0 8px;align-items:center;font-size:14px}
@media (max-width:380px){.months{font-size:13px;gap:0 6px}}
.months .h{font-size:12px;color:var(--muted);font-weight:700;padding-bottom:4px;text-align:right}
.months .h:first-child,.months .h:nth-child(2){text-align:left}
.months .c{padding:6px 0;border-top:1px solid var(--line);text-align:right;min-height:56px;display:flex;align-items:center;justify-content:flex-end}
.months .c.m{justify-content:flex-start}
.months .c.t{justify-content:flex-start}
.months .m button{border:0;background:none;padding:8px 0;font-weight:700;color:var(--accent);min-height:44px;text-align:left}
.months .off{color:var(--muted);opacity:.7}
.months .tot{font-weight:800;border-top:2px solid var(--ink)}

/* forms + sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(6,16,11,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 18px) max(18px,env(safe-area-inset-left));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px;padding-bottom:20px}}
.sheet h2{font:700 21px/1.25 var(--display);margin:0 0 4px}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label,.field .lbl{font-weight:700;font-size:14px}
.field .hint{margin:0}
.field input,.field select,.field textarea{width:100%;min-height:48px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.field textarea{min-height:96px;font:13px/1.4 ui-monospace,Menlo,monospace}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.money{position:relative}
.money input{padding-left:28px}
.money::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.money.pct::before{content:"%";left:auto;right:14px}
.money.pct input{padding-left:12px;padding-right:32px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two .field{margin-top:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;font-weight:600}
.seg input{width:20px;height:20px;accent-color:var(--band)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:600}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--band)}
.check span small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.msgline{margin:10px 0 0;font-weight:600;color:var(--pos)}
.msgline.bad{color:var(--neg)}
.sheet .btns{margin-top:18px}
.danger-row{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.danger-row .link{color:var(--neg)}
.lines{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.lines td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.lines td:last-child{text-align:right;padding-left:12px}
.lines .ln{color:var(--muted);font-size:13px;width:3.2em}
.lines tr.big td{font-weight:800;border-top:2px solid var(--ink)}

/* tabs */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(2,1fr);background:var(--card);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 4px) max(6px,env(safe-area-inset-left))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-height:52px;color:var(--muted);font-size:12px;font-weight:700}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:min(92vw,440px);text-align:center;z-index:70}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="row1"><span class="brand"><i aria-hidden="true"></i>Cookie Jar</span><span class="status"><i aria-hidden="true"></i>Saved only on this phone</span></div>
  <div id="hero" aria-live="polite"></div>
</div></header>
<main id="main"><div class="wrap" id="notice"></div><div class="wrap stack" id="view"></div></main>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2Z"/><circle cx="16" cy="14.5" r="1.3" fill="currentColor"/></svg>Budget</button>
  <button type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>More</button>
</nav>
<div class="sheet-bg" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"><div id="sheet-body"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
{
const APP_VERSION = "1";
const APP = {"id": "cookie", "name": "Cookie Jar", "tabs": ["budget", "more"], "code": "CJ1.", "key": "cookiejar-v1", "safe": "cookiejar-safe", "share": true, "url": "https://cookiejar.gatosrecipebox.com/", "eraseWhat": "every account and check-in", "eraseConfirm": "Every account and check-in on this phone will be deleted. This can’t be undone without a backup code."};
const LS_KEY = APP.key, SAFE_KEY = APP.safe;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
// Expense lines on the landlord tax form (IRS Schedule E). Depreciation (line 18) is left to the tax preparer.
const CATS = [["adv","Advertising",5],["auto","Auto and travel",6],["clean","Cleaning and maintenance",7],["comm","Commissions",8],["ins","Insurance",9],["legal","Legal and professional fees",10],["mgmt","Management fees",11],["mint","Mortgage interest",12],["oint","Other interest",13],["rep","Repairs",14],["sup","Supplies",15],["tax","Taxes",16],["util","Utilities",17],["other","Other",19]];
const CAT = Object.fromEntries(CATS.map(c => [c[0], c]));
const FREQ = { month:"Every month", year:"Every year", pct:"Percent of rent collected" };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>';
const CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, "0");
const sum = (a) => a.reduce((t, x) => t + (+x || 0), 0);
const num = (x) => { x = +x; return isFinite(x) ? x : 0; };
const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const thisYear = () => new Date().getFullYear();
const curYM = () => today().slice(0, 7);
const ymKey = (y, m) => y + "-" + pad(m + 1);
const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const shortDate = (s) => { const d = parseDate(s); return MONTHS[d.getMonth()] + " " + d.getDate() + (d.getFullYear() !== thisYear() ? ", " + d.getFullYear() : ""); };
const ymLabel = (k) => MONTHS_LONG[+k.slice(5, 7) - 1] + " " + k.slice(0, 4);
const F0 = new Intl.NumberFormat("en-US", { style:"currency", currency:"USD", minimumFractionDigits:0, maximumFractionDigits:0 });
const F2 = new Intl.NumberFormat("en-US", { style:"currency", currency:"USD", minimumFractionDigits:2, maximumFractionDigits:2 });
function money(n, cents){ n = Math.round(num(n) * 100) / 100; let v = cents ? n : Math.round(n); if(v === 0) v = 0; return (cents && Math.abs(v % 1) > 0.001 ? F2 : F0).format(v).replace("-", "−"); }
function signed(n, cents){ const r = Math.round(num(n)); return (r > 0 ? "+" : "") + money(n, cents); }
function cls(n){ return Math.round(n) < 0 ? "neg" : Math.round(n) > 0 ? "pos" : ""; }
function parseMoney(v){ const t = String(v == null ? "" : v).replace(/[$,%\s]/g, "").replace("−", "-"); if(t === "") return null; const n = Number(t); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; }
function pct(x){ return (x * 100).toFixed(1).replace(/\.0$/, "") + "%"; }
function inputVal(n){ return n == null || n === "" ? "" : String(Math.round(num(n) * 100) / 100); }

/* ---------- saved data */
function blank(){ return { v:1, accounts:[], checkins:[], props:[], expenses:[], backupAt:0, createdAt:0, updatedAt:0, sample:false, hideA2hs:false }; }
function normalize(o){
  const s = blank(), arr = (x) => Array.isArray(x) ? x : [], obj = (x) => x && typeof x === "object" ? x : {};
  if(!o || typeof o !== "object") return s;
  s.accounts = arr(o.accounts).filter(a => a && a.id).map(a => ({ id:String(a.id), name:String(a.name || "Account").slice(0, 40), kind:a.kind === "owe" ? "owe" : "have", archived:!!a.archived }));
  s.checkins = arr(o.checkins).filter(c => c && /^\d{4}-\d{2}-\d{2}$/.test(c.date)).map(c => {
    const bal = {}; Object.keys(obj(c.bal)).forEach(k => { const v = +c.bal[k]; if(isFinite(v)) bal[k] = v; });
    return { id:String(c.id || uid()), date:c.date, bal };
  });
  s.props = arr(o.props).filter(p => p && p.id).map(p => {
    const interest = {}, rentIn = {};
    Object.keys(obj(p.interest)).forEach(k => { if(/^\d{4}$/.test(k) && isFinite(+p.interest[k])) interest[k] = +p.interest[k]; });
    Object.keys(obj(p.rentIn)).forEach(k => { if(/^\d{4}-\d{2}$/.test(k) && isFinite(+p.rentIn[k])) rentIn[k] = +p.rentIn[k]; });
    return { id:String(p.id), name:String(p.name || "Property").slice(0, 40), rent:num(p.rent), mortgage:num(p.mortgage), taxes:num(p.taxes), insurance:num(p.insurance), escrow:!!p.escrow, invested:num(p.invested),
      start:/^\d{4}-\d{2}$/.test(p.start) ? p.start : thisYear() + "-01",
      extras:arr(p.extras).filter(x => x && x.id).map(x => ({ id:String(x.id), name:String(x.name || "Cost").slice(0, 40), amount:num(x.amount), freq:FREQ[x.freq] ? x.freq : "month", cat:CAT[x.cat] ? x.cat : "other" })),
      interest, rentIn };
  });
  const ids = new Set(s.props.map(p => p.id));
  s.expenses = arr(o.expenses).filter(e => e && ids.has(String(e.prop)) && /^\d{4}-\d{2}-\d{2}$/.test(e.date)).map(e => ({ id:String(e.id || uid()), prop:String(e.prop), date:e.date, amount:num(e.amount), cat:CAT[e.cat] ? e.cat : "other", note:String(e.note || "").slice(0, 80) }));

let storageOK = true;
function load(){
  try{
    const r = localStorage.getItem(LS_KEY) || localStorage.getItem(SAFE_KEY);
    if(r){ const s = normalize(JSON.parse(r)); try{ localStorage.removeItem(SAFE_KEY); }catch(e){} return s; }
  }catch(e){}
  return blank();
}
function writeLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); storageOK = true; }catch(e){ storageOK = false; } }
function save(){ S.updatedAt = Date.now(); if(!S.createdAt && hasData()) S.createdAt = S.updatedAt; writeLocal(); }
function hasData(){ return APP.id === "cookie" ? (S.accounts.length || S.checkins.length) : (S.props.length || S.expenses.length); }
let S = load();
const ui = { tab:APP.tabs[0], prop:null, year:thisYear(), allHistory:false, sheet:null, backupMsg:{ t:"", bad:false } };

/* ---------- budget math */
const activeAccounts = () => S.accounts.filter(a => !a.archived);
const accById = (id) => S.accounts.find(a => a.id === id);
const sortedCheckins = () => S.checkins.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
function totals(c){
  let have = 0, owe = 0;
  Object.keys(c.bal).forEach(id => { const a = accById(id); if(!a) return; if(a.kind === "owe") owe += c.bal[id]; else have += c.bal[id]; });
  return { have, owe, net:have - owe };
}
function lastTwo(id){ const out = []; const cs = sortedCheckins(); for(let i = cs.length - 1; i >= 0 && out.length < 2; i--) if(typeof cs[i].bal[id] === "number") out.push(cs[i].bal[id]); return out; }

/* ---------- rental math */
const propById = (id) => S.props.find(p => p.id === id);
const extraAmt = (x, rent) => x.freq === "month" ? x.amount : x.freq === "year" ? x.amount / 12 : x.amount / 100 * rent;
function propMonth(p, y, m){
  const key = ymKey(y, m), started = key >= p.start;
  const fixed = started && key <= curYM();              // set monthly costs count from the start month up to this month
  const got = started && typeof p.rentIn[key] === "number";
  const rent = got ? p.rentIn[key] : 0;
  const exp = S.expenses.filter(e => e.prop === p.id && e.date.slice(0, 7) === key);
  const expSum = sum(exp.map(e => e.amount));
  const mort = fixed ? p.mortgage : 0, tax = fixed ? p.taxes / 12 : 0, ins = fixed ? p.insurance / 12 : 0;
  const extras = fixed ? p.extras.map(x => ({ x, amt:extraAmt(x, rent) })) : [];
  const costs = mort + (p.escrow ? 0 : tax + ins) + sum(extras.map(e => e.amt)) + expSum;
  return { key, started, fixed, got, rent, mort, tax, ins, extras, exp, expSum, costs, profit:rent - costs };
}
function propYear(p, y){
  const months = MONTHS.map((_, m) => propMonth(p, y, m));
  return { months, rent:sum(months.map(r => r.rent)), costs:sum(months.map(r => r.costs)), profit:sum(months.map(r => r.profit)) };
}
const expected = (p) => p.rent - p.mortgage - (p.escrow ? 0 : (p.taxes + p.insurance) / 12) - sum(p.extras.map(x => extraAmt(x, p.rent)));
const yearlyReturn = (p) => p.invested > 0 ? expected(p) * 12 / p.invested : null;
function taxSummary(props, y){
  const lines = {}; CATS.forEach(c => lines[c[0]] = 0);
  let rents = 0; const missing = [];
  props.forEach(p => {
    MONTHS.forEach((_, m) => {
      const r = propMonth(p, y, m); rents += r.rent;
      if(r.fixed){ lines.tax += r.tax; lines.ins += r.ins; r.extras.forEach(e => lines[e.x.cat] += e.amt); }
      r.exp.forEach(e => lines[e.cat] += e.amount);
    });
    if(typeof p.interest[y] === "number") lines.mint += p.interest[y]; else if(p.mortgage > 0) missing.push(p);
  });
  const total = sum(Object.values(lines));
  return { rents, lines, total, net:rents - total, missing };
}
function years(){
  let lo = thisYear();
  S.props.forEach(p => { lo = Math.min(lo, +p.start.slice(0, 4)); });
  S.expenses.forEach(e => { lo = Math.min(lo, +e.date.slice(0, 4)); });
  const out = []; for(let y = lo; y <= thisYear(); y++) out.push(y); return out;
}
function guessCat(name){
  const n = name.toLowerCase();
  if(/manag/.test(n)) return "mgmt"; if(/insur/.test(n)) return "ins"; if(/tax/.test(n)) return "tax";
  if(/water|sewer|electric|gas|trash|util|internet/.test(n)) return "util"; if(/clean|lawn|landscap|pest|snow|maint/.test(n)) return "clean";
  if(/repair|fix|plumb/.test(n)) return "rep"; if(/legal|lawyer|attorney|account|cpa|bookkeep/.test(n)) return "legal";
  if(/advert|listing|marketing/.test(n)) return "adv"; if(/commission|leasing|finder/.test(n)) return "comm"; if(/suppl/.test(n)) return "sup";
  if(/mileage|travel|gas for|car/.test(n)) return "auto"; return "other";
}

function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function isStandalone(){ try{ return navigator.standalone === true || matchMedia("(display-mode: standalone)").matches; }catch(e){ return false; } }

/* ---------- chart */
let figObs = null;
function drawCharts(){
  if(figObs){ figObs.disconnect(); figObs = null; }
  const box = $("#netfig"); if(!box) return;
  const svg = box.querySelector("svg"), pts = sortedCheckins().map(c => ({ d:c.date, v:totals(c).net }));
  const draw = () => {
    const W = box.clientWidth, H = box.clientHeight; if(!W || !H) return;
    const L = 6, R = 10, T = 30, B = 26, vs = pts.map(p => p.v);
    let lo = Math.min(...vs), hi = Math.max(...vs); if(hi - lo < 1){ hi += 50; lo -= 50; }
    const padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
    const t0 = parseDate(pts[0].d).getTime(), t1 = parseDate(pts[pts.length - 1].d).getTime(), span = Math.max(1, t1 - t0);
    const x = (d) => L + (parseDate(d).getTime() - t0) / span * (W - L - R), yv = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
    const line = pts.map((p, i) => (i ? "L" : "M") + x(p.d).toFixed(1) + " " + yv(p.v).toFixed(1)).join(" ");
    const base = yv(lo), area = line + ` L${x(pts[pts.length - 1].d).toFixed(1)} ${base} L${x(pts[0].d).toFixed(1)} ${base} Z`;
    const zero = lo < 0 && hi > 0 ? `<line x1="${L}" x2="${W - R}" y1="${yv(0)}" y2="${yv(0)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/><text x="${L}" y="${yv(0) - 5}">$0</text>` : "";
    const lastP = pts[pts.length - 1], lx = x(lastP.d), ly = yv(lastP.v);
    const dots = pts.length <= 26 ? pts.map(p => `<circle cx="${x(p.d).toFixed(1)}" cy="${yv(p.v).toFixed(1)}" r="3" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>`).join("") : "";
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = `<path d="${area}" fill="var(--accent)" opacity=".12"/>${zero}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
      <circle cx="${lx}" cy="${ly}" r="5.5" fill="var(--accent)"/><text class="lab num" x="${lx}" y="${Math.max(16, ly - 12)}" text-anchor="end">${money(lastP.v)}</text>
      <text x="${L}" y="${H - 6}">${shortDate(pts[0].d)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(lastP.d)}</text>`;
  };
  if(window.ResizeObserver){ figObs = new ResizeObserver(draw); figObs.observe(box); } draw();
}

/* ---------- backup codes */
function encodeBackup(){
  const body = APP.id === "cookie" ? { v:1, a:S.accounts, c:S.checkins, s:S.sample ? 1 : 0 } : { v:1, p:S.props, e:S.expenses, s:S.sample ? 1 : 0 };
  return APP.code + btoa(unescape(encodeURIComponent(JSON.stringify(body))));
}
function decodeBackup(code){
  let raw = String(code || "").trim().replace(/\s+/g, "");
  const m = /^([A-Z]{2}\d\.)/.exec(raw);
  if(m){ if(m[1] !== APP.code) throw new Error("other"); raw = raw.slice(m[1].length); }
  const o = JSON.parse(decodeURIComponent(escape(atob(raw))));
  const s = APP.id === "cookie" ? normalize({ accounts:o.a, checkins:o.c, sample:!!o.s }) : normalize({ props:o.p, expenses:o.e, sample:!!o.s });
  if(APP.id === "cookie" ? !(s.accounts.length || s.checkins.length) : !s.props.length) throw new Error("empty");
  return s;
}
let pendingRestore = null;
function askRestore(code){
  try{ pendingRestore = decodeBackup(code); }
  catch(e){ ui.backupMsg = { t:e.message === "other" ? "That code is from a different app. Paste it into the app it came from." : "That code didn’t work. Copy the whole code, starting with " + APP.code + ", and try again.", bad:true }; pendingRestore = null; if(ui.tab === "more") renderView(); return; }
  const r = pendingRestore, n = (x, w) => x + " " + w + (x === 1 ? "" : "s");
  const what = APP.id === "cookie" ? n(r.accounts.length, "account") + " and " + n(r.checkins.length, "check-in") : n(r.props.length, "property").replace("propertys", "properties") + " and " + n(r.expenses.length, "expense");
  sheetConfirm("Restore this backup?", `It has ${what}. It replaces what’s on this phone now.`, "doRestore", "", "Restore");
}

function copyText(text, ta){
  const done = () => true;
  try{ if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(done, () => fallbackCopy(ta)); }catch(e){}
  return Promise.resolve(fallbackCopy(ta));
}
function fallbackCopy(ta){ if(!ta) return false; try{ ta.removeAttribute("readonly"); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); const ok = document.execCommand && document.execCommand("copy"); ta.setAttribute("readonly", ""); return !!ok; }catch(e){ return false; } }

  seq.forEach((r, i) => { const d = new Date(base); d.setDate(d.getDate() - 7 * (seq.length - 1 - i)); const bal = {}; acc.forEach((a, j) => bal[a.id] = r[j]); s.checkins.push({ id:uid(), date:iso(d), bal }); });

  const y = thisYear(), nowM = new Date().getMonth();

    case "editCheckin": sheetCheckin(S.checkins.find(c => c.id === id)); break;
    case "deleteCheckin": if(!b.dataset.ok){ sheetConfirm("Delete this check-in?", "Its balances will be removed from your history.", "deleteCheckin", id, "Delete"); break; }
      S.checkins = S.checkins.filter(c => c.id !== id); save(); closeSheet(); render(); toast("Check-in deleted"); break;
    case "toggleHistory": ui.allHistory = !ui.allHistory; renderView(); break;
    case "addProp": sheetProp(null); break;
    case "editProp": sheetProp(propById(id)); break;
    case "openProp": ui.prop = id; render(); $("#main").scrollTop = 0; break;
    case "closeProp": ui.prop = null; render(); $("#main").scrollTop = 0; break;
    case "deleteProp": if(!b.dataset.ok){ sheetConfirm("Delete this property?", "Its rent ticks, costs and expenses will be deleted too.", "deleteProp", id, "Delete property"); break; }
      S.props = S.props.filter(p => p.id !== id); S.expenses = S.expenses.filter(e => e.prop !== id); ui.prop = null; save(); closeSheet(); render(); toast("Property deleted"); break;
    case "year": { const ys = years(), i = ys.indexOf(ui.year) + (+b.dataset.d); if(i >= 0 && i < ys.length){ ui.year = ys[i]; render(); } break; }
    case "tick": {
      const p = propById(id); if(!p) break; const k = b.dataset.k;
      if(typeof p.rentIn[k] === "number") delete p.rentIn[k]; else p.rentIn[k] = p.rent;
      save(); render(); toast(typeof p.rentIn[k] === "number" ? p.name + ": " + ymLabel(k) + " rent in" : "Rent tick removed"); break;
    }
    case "month": sheetMonth(propById(ui.prop), b.dataset.k); break;
    case "addCost": sheetCost(null); break;
    case "editCost": { const p = propById(ui.prop); sheetCost(p && p.extras.find(x => x.id === id)); break; }
    case "deleteCost": { const p = propById(ui.prop); if(p){ p.extras = p.extras.filter(x => x.id !== id); save(); } closeSheet(); render(); toast("Cost removed"); break; }
    case "addExpense": if(!S.props.length){ sheetProp(null); break; } sheetExpense(null, id); break;
    case "editExpense": sheetExpense(S.expenses.find(e => e.id === id)); break;
    case "deleteExpense": S.expenses = S.expenses.filter(e => e.id !== id); save(); closeSheet(); render(); toast("Expense deleted"); break;
    case "tax": sheetTax(id); break;
    case "copyTax": { const ta = $("#tax-text"); copyText(ta.value, ta).then(ok => toast(ok === false ? "Couldn’t copy. Try again." : "Summary copied. Paste it into a note or an email.")); break; }
    case "goBackup": go("more"); setTimeout(() => { const el = $("#backup"); if(el) el.scrollIntoView({ block:"start" }); }, 30); break;
    case "goA2hs": go("more"); setTimeout(() => { const el = $("#a2hs"); if(el) el.scrollIntoView({ block:"start" }); }, 30); break;
    case "hideA2hs": S.hideA2hs = true; writeLocal(); renderNotice(); break;
    case "copyBackup": {
      const code = encodeBackup(), ta = $("#f-backup"); if(ta) ta.value = code;
      copyText(code, ta).then(ok => {
        if(ok === false){ ui.backupMsg = { t:"The code is in the box above. Press and hold it, then tap Copy.", bad:false }; }
        else { S.backupAt = Date.now(); writeLocal(); ui.backupMsg = { t:"Copied. Paste it into a note or a text to yourself.", bad:false }; }
        renderView(); const t2 = $("#f-backup"); if(t2 && ok === false) t2.value = code;
      }); break;
    }
    case "fileBackup": {
      try{
        const blob = new Blob([encodeBackup()], { type:"text/plain" }), a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "dough-box-backup-" + today() + ".txt"; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        S.backupAt = Date.now(); writeLocal(); ui.backupMsg = { t:"Backup file saved. On iPhone it goes to the Files app, in Downloads.", bad:false };
      }catch(e){ ui.backupMsg = { t:"This browser couldn’t save a file. Use Copy backup code instead.", bad:true }; }
      renderView(); break;
    }
    case "restore": askRestore(($("#f-backup") || {}).value); break;
    case "doRestore": if(pendingRestore){ const keep = S.hideA2hs; S = pendingRestore; S.hideA2hs = keep; S.backupAt = Date.now(); save(); pendingRestore = null; ui.prop = null; ui.year = thisYear(); ui.backupMsg = { t:"Backup restored.", bad:false }; closeSheet(); render(); toast("Backup restored"); } break;
    case "erase": sheetConfirm("Erase everything?", APP.eraseConfirm, "doErase", "", "Erase everything"); break;
    case "doErase": { const keep = S.hideA2hs; S = blank(); S.hideA2hs = keep; save(); closeSheet(); ui.prop = null; render(); toast("Erased. Starting fresh."); break; }
    case "update": checkForUpdate(true); break;
    case "share": {
      const data = { title:APP.name, text:"A one-minute weekly money check-in. Your numbers stay on your own phone.", url:APP.url };
      if(navigator.share) navigator.share(data).catch(() => {});
      else copyText(APP.url, null).then(ok => toast(ok === false ? APP.url : "Link copied. Paste it in a text or email."));
      break;
    }
  }
});
document.addEventListener("change", (ev) => {
  if(ev.target.id === "f-file"){
    const f = ev.target.files && ev.target.files[0]; if(!f) return;
    const r = new FileReader(); r.onload = () => askRestore(String(r.result || "")); r.onerror = () => { ui.backupMsg = { t:"Couldn’t open that file.", bad:true }; renderView(); }; r.readAsText(f); ev.target.value = "";
  }
  if(ev.target.id === "f-freq"){
    const isPct = ev.target.value === "pct", w = $("#amt-wrap"), cur = $("#f-amt") ? $("#f-amt").value : "";
    w.innerHTML = moneyField("f-amt", isPct ? "Percent" : "Amount", cur, "", isPct);
  }
});
document.addEventListener("input", (ev) => {
  if(ev.target.id === "f-name" && ui.sheet === "cost"){ const form = ev.target.closest("form"); if(form && !form.dataset.id && !form.dataset.catTouched) $("#f-cat").value = guessCat(ev.target.value); }
  if(ev.target.id === "f-cat"){ const form = ev.target.closest("form"); if(form) form.dataset.catTouched = "1"; }
});
document.addEventListener("keydown", (ev) => { if(ev.key === "Escape" && ui.sheet) closeSheet(); });
$("#sheet-body").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target, kind = f.dataset.form, id = f.dataset.id, val = (sel) => ($(sel, f) || {}).value;
  const need = (sel, label, opts = {}) => { const n = parseMoney(val(sel)); if(n === null){ if(opts.optional) return 0; throw label + " is empty."; } if(isNaN(n)) throw label + " should be a number, like 1250."; if(n < 0 && !opts.neg) throw label + " can’t be below zero."; return n; };
  try{
    if(kind === "account"){
      const name = val("#f-name").trim(); if(!name) throw "Give the account a nickname.";
      const k = (f.querySelector("input[name=kind]:checked") || {}).value === "owe" ? "owe" : "have";
      if(id){ const a = accById(id); a.name = name; a.kind = k; } else S.accounts.push({ id:uid(), name, kind:k, archived:false });
      save(); closeSheet(); render(); toast(id ? "Saved" : name + " added"); return;
    }
    if(kind === "checkin"){
      const date = val("#f-date"); if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw "Pick a date.";
      const bal = {}; activeAccounts().forEach(a => { const n = need("#b-" + a.id, a.name, { optional:true, neg:true }); if(parseMoney(val("#b-" + a.id)) !== null) bal[a.id] = n; });
      if(!Object.keys(bal).length) throw "Type in at least one balance.";
      let c = id ? S.checkins.find(x => x.id === id) : S.checkins.find(x => x.date === date);
      if(id){ const clash = S.checkins.find(x => x.date === date && x.id !== id); if(clash) S.checkins = S.checkins.filter(x => x !== clash); }
      if(c){ Object.keys(c.bal).forEach(k2 => { const a = accById(k2); if(a && !a.archived) delete c.bal[k2]; }); Object.assign(c.bal, bal); c.date = date; }
      else S.checkins.push({ id:uid(), date, bal });
      save(); closeSheet(); render(); toast("Check-in saved"); return;
    }
    if(kind === "prop"){
      const name = val("#f-name").trim(); if(!name) throw "Give the property a name.";
      const o = { name, rent:need("#f-rent", "Monthly rent"), mortgage:need("#f-mort", "Mortgage payment", { optional:true }), taxes:need("#f-taxes", "Property taxes", { optional:true }), insurance:need("#f-ins", "Insurance", { optional:true }),
        escrow:$("#f-escrow", f).checked, invested:need("#f-inv", "Cash you put in", { optional:true }), start:val("#f-sy") + "-" + pad(+val("#f-sm") + 1) };
      if(id){ Object.assign(propById(id), o); } else { const p = Object.assign({ id:uid(), extras:[], interest:{}, rentIn:{} }, o); S.props.push(p); ui.prop = p.id; ui.year = thisYear(); }
      save(); closeSheet(); render(); toast(id ? "Saved" : name + " added"); return;
    }
    if(kind === "cost"){
      const p = propById(ui.prop), name = val("#f-name").trim(); if(!name) throw "Give the cost a name.";
      const freq = val("#f-freq"), amount = need("#f-amt", freq === "pct" ? "Percent" : "Amount");
      if(freq === "pct" && amount > 100) throw "A percent should be 100 or less.";
      const o = { name, freq, amount, cat:val("#f-cat") };
      if(id){ Object.assign(p.extras.find(x => x.id === id), o); } else p.extras.push(Object.assign({ id:uid() }, o));
      save(); closeSheet(); render(); toast(id ? "Saved" : name + " added"); return;
    }
    if(kind === "expense"){
      const pid = val("#f-prop"); if(!pid) throw "Choose a property.";
      const date = val("#f-date"); if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw "Pick a date.";
      const o = { prop:pid, date, amount:need("#f-amt", "Amount"), cat:val("#f-cat"), note:val("#f-note").trim() };
      if(id) Object.assign(S.expenses.find(e => e.id === id), o); else S.expenses.push(Object.assign({ id:uid() }, o));
      if(String(ui.year) !== date.slice(0, 4) && years().includes(+date.slice(0, 4))) ui.year = +date.slice(0, 4);
      save(); closeSheet(); render(); toast(id ? "Saved" : "Expense logged"); return;
    }
    if(kind === "month"){
      const p = propById(id), k = f.dataset.k;
      if($("#f-got", f).checked) p.rentIn[k] = need("#f-amt", "Amount received"); else delete p.rentIn[k];
      save(); closeSheet(); render(); toast("Saved"); return;
    }
    if(kind === "tax"){
      const props = ui.taxProp ? [propById(ui.taxProp)] : S.props;
      props.filter(p => p.mortgage > 0).forEach(p => { const v = parseMoney(val("#i-" + p.id)); if(v === null) delete p.interest[ui.year]; else if(isNaN(v) || v < 0) throw "Mortgage interest for " + p.name + " should be a number."; else p.interest[ui.year] = v; });
      save(); render(); sheetTax(ui.taxProp); toast("Interest saved"); return;
    }
  }catch(err){ sheetErr(typeof err === "string" ? err : "Something went wrong. Check the numbers and try again."); }
});

/* ---------- updates (same approach as Daily Bread) */
const upd = { state:"", at:0, v:"" };
function updText(){
  return ({ checking:"Checking for updates…", ready:"An update is ready.", updating:"Updating…", current:"You have the newest version.", offline:"Couldn’t check. Are you online?" })[upd.state] || "Version " + APP_VERSION + ". Updates arrive by themselves when you open the app online.";
}
function showUpd(){ const el = $("#upd-line"); if(el) el.textContent = updText(); }
async function checkForUpdate(manual){
  if(!/^https?:$/.test(location.protocol)) return;
  upd.state = "checking"; if(manual) showUpd();
  try{
    const r = await fetch(new URL("index.html", location.href).href + "?v=" + Date.now(), { cache:"no-store" });
    if(!r.ok) throw new Error("status " + r.status);
    const m = /const APP_VERSION = "(\d+)"/.exec(await r.text());
    upd.v = m ? m[1] : ""; upd.state = m && +m[1] > +APP_VERSION ? "ready" : "current";
  }catch(e){ upd.state = "offline"; }
  upd.at = Date.now();
  if(upd.state === "ready" && (manual || !ui.sheet)) return applyUpdate();
  showUpd();
}
async function applyUpdate(){
  upd.state = "updating"; showUpd();
  try{ writeLocal(); localStorage.setItem(SAFE_KEY, JSON.stringify(S)); }catch(e){}
  try{ sessionStorage.setItem("db-from", APP_VERSION); }catch(e){}
  try{
    const here = location.href.split("#")[0];
    await Promise.all([here, new URL("./", here).href, new URL("index.html", here).href, new URL("sw.js", here).href].map(u => fetch(u, { cache:"reload" }).catch(() => {})));
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg) await reg.update().catch(() => {});
  }catch(e){}
  location.reload();
}

/* ---------- start */
const h = (location.hash || "").slice(1); if(APP.tabs.includes(h)) ui.tab = h;
render();
(function afterUpdate(){ let from = null; try{ from = sessionStorage.getItem("db-from"); sessionStorage.removeItem("db-from"); }catch(e){} if(from && +APP_VERSION > +from) setTimeout(() => toast("Updated to the newest version. Your numbers are just as you left them."), 700); })();
setTimeout(() => checkForUpdate(false), 4000);
document.addEventListener("visibilitychange", () => { if(!document.hidden){ if(Date.now() - upd.at > 10 * 60 * 1000) checkForUpdate(false); renderHero(); renderNotice(); } });
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
window.__dough = { get S(){ return S; }, expected, yearlyReturn, propYear, taxSummary, totals, sortedCheckins };
}
